<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SHUBHAM PANEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Teko:wght@600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    :root {
      --green: #39ff14;
      --green2: #00c83c;
      --lime: #b9ff00;
      --cyan: #00eaff;
      --gold: #ffe600;
      --red: #ff225d;
      --purple: #bc28ff;
      --ink: #000603;
      --panel: #001208;
      --white: #fff;
      --flight: 2.25s;
      --scan-progress: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000 !important;
      color: #fff;
      font-family: Orbitron, sans-serif
    }

    button {
      font: inherit
    }

    .hidden {
      display: none !important
    }

    /* GAME BACKGROUND FRAME */
    #target-game-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
      display: block;
    }

    #burstCanvasLayer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99995
    }

    /* TOP ACTIVITY CARD */
    #liveWinLayer {
      position: fixed;
      inset: 0;
      z-index: 99990;
      pointer-events: none;
      overflow: hidden
    }

    .lw-card {
      position: absolute;
      top: 64px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 92vw;
      padding: 7px 14px 7px 8px;
      border: 1px solid rgba(57, 255, 20, .62);
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(0, 30, 11, .96), rgba(0, 5, 2, .98));
      box-shadow: 0 10px 25px #000, 0 0 20px rgba(57, 255, 20, .35), inset 0 0 15px rgba(57, 255, 20, .15);
      backdrop-filter: blur(10px);
      opacity: 0;
      animation: toastIn .45s cubic-bezier(.2, 1.15, .35, 1.1) forwards, toastOut .35s ease-in 4.15s forwards
    }

    .lw-card:after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 2px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--green), var(--cyan), var(--gold));
      transform-origin: left;
      animation: toastTimer 4.35s linear forwards
    }

    @keyframes toastIn {
      0% {
        transform: translateX(115%) scale(.85);
        opacity: 0
      }

      65% {
        transform: translateX(-52%) scale(1.03);
        opacity: 1
      }

      100% {
        transform: translateX(-50%) scale(1);
        opacity: 1
      }
    }

    @keyframes toastOut {
      to {
        transform: translateX(115%) scale(.88);
        opacity: 0
      }
    }

    @keyframes toastTimer {
      to {
        transform: scaleX(0)
      }
    }

    .lw-sig {
      padding: 3px 5px;
      border-radius: 4px;
      background: linear-gradient(#fff, var(--lime));
      color: #001006;
      font-size: 7px;
      font-weight: 900;
      box-shadow: 0 0 8px var(--green)
    }

    .lw-avatar {
      position: relative;
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      flex: none;
      overflow: hidden;
      border: 1px solid var(--green);
      border-radius: 50%;
      background: #001208;
      color: #fff;
      font: 700 12px Chakra Petch;
      box-shadow: 0 0 9px rgba(57, 255, 20, .5)
    }

    .lw-avatar-fb {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 900 12px Chakra Petch;
      color: #fff
    }

    .lw-avatar img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .lw-text {
      min-width: 0;
      line-height: 1.16
    }

    .lw-label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--cyan);
      font-size: 6.8px;
      font-weight: 900;
      letter-spacing: .15em;
      text-shadow: 0 0 6px var(--cyan)
    }

    .lw-label:before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 1s infinite
    }

    .lw-name {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font: 700 11px Chakra Petch
    }

    .lw-amt {
      margin-left: 4px;
      color: var(--gold);
      font: 12px Audiowide;
      text-shadow: 0 0 7px var(--gold)
    }

    @keyframes blink {
      50% {
        opacity: .25
      }
    }

    /* FLOATING ORB */
    .launcher {
      position: fixed;
      right: 18px;
      bottom: 120px;
      width: 58px;
      height: 58px;
      z-index: 99999;
      display: grid;
      place-items: center;
      border: 1.5px solid rgba(57, 255, 20, .65);
      border-radius: 50%;
      cursor: pointer;
      touch-action: none;
      background: radial-gradient(circle at 32% 25%, rgba(57, 255, 20, .34), transparent 48%), linear-gradient(145deg, #003012, #000b05 62%, #000);
      box-shadow: 0 12px 28px #000, 0 0 18px rgba(57, 255, 20, .48), inset 0 0 15px rgba(57, 255, 20, .24);
      animation: orbFloat 3.8s ease-in-out infinite
    }

    .launcher.hidden {
      display: none !important
    }

    @keyframes orbFloat {
      50% {
        transform: translateY(-7px) rotate(2deg)
      }
    }

    .launcher-glass {
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, .16), transparent 55%)
    }

    .launcher-core {
      position: relative;
      z-index: 4;
      width: 72%;
      height: 72%;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      filter: drop-shadow(0 0 6px var(--green))
    }

    .launcher-icon-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      pointer-events: none
    }

    .launcher-fallback {
      font: 900 17px Chakra Petch;
      color: var(--green);
      text-shadow: 0 0 8px var(--green)
    }

    .launcher-ring {
      position: absolute;
      inset: -8px;
      width: calc(100% + 16px);
      height: calc(100% + 16px);
      pointer-events: none
    }

    .launcher-ring circle {
      fill: none;
      stroke: var(--green);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-dasharray: 28 16;
      transform-origin: 50% 50%;
      animation: spin 6s linear infinite;
      filter: drop-shadow(0 0 3px var(--green))
    }

    .launcher-ring .r2 {
      stroke: var(--lime);
      stroke-width: 1.1;
      stroke-dasharray: 8 21;
      animation-duration: 4s;
      animation-direction: reverse
    }

    .launcher-orbit {
      position: absolute;
      inset: -6px;
      z-index: 3;
      animation: spin 3s linear infinite
    }

    .launcher-orbit i {
      position: absolute;
      top: -2px;
      left: 50%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 9px var(--lime)
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* FLOATING PANEL + WINGS */
    .wrap {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 100000;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      touch-action: none;
      transform: translate(-50%, -50%) scale(.9);
      transition: opacity .2s ease, transform .25s cubic-bezier(.2, .9, .2, 1.1)
    }

    .wrap.visible {
      display: flex;
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1)
    }

    .flight-chassis {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: chassisFloat var(--flight) ease-in-out infinite;
      will-change: transform
    }

    @keyframes chassisFloat {
      50% {
        transform: translateY(-8px) rotate(-.45deg)
      }
    }

    .wing-backlight {
      position: absolute;
      width: 280px;
      height: 160px;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse, rgba(57, 255, 20, .045), transparent 70%);
      filter: blur(8px)
    }

    .wing {
      position: absolute;
      top: 48%;
      width: 220px;
      height: 165px;
      z-index: 1;
      pointer-events: none;
      background: url('https://i.ibb.co/mF1fS5m2/file-0000000017bc8211a51be6c0e30fe47a.png') center/contain no-repeat;
      filter: drop-shadow(0 0 2px rgba(57, 255, 20, .12));
      will-change: transform
    }

    .wing.left {
      left: -80px;
      background-position: left center;
      clip-path: polygon(0 0, 66% 0, 66% 100%, 0 100%);
      transform-origin: right 58%;
      animation: flapL var(--flight) ease-in-out infinite
    }

    .wing.right {
      right: -80px;
      background-position: right center;
      clip-path: polygon(34% 0, 100% 0, 100% 100%, 34% 100%);
      transform-origin: left 58%;
      animation: flapR var(--flight) ease-in-out infinite
    }

    @keyframes flapL {

      0%,
      100% {
        transform: translateY(-50%) rotate(-12deg) scaleY(.94)
      }

      50% {
        transform: translateY(-50%) rotate(14deg) scaleY(1.06)
      }
    }

    @keyframes flapR {

      0%,
      100% {
        transform: translateY(-50%) rotate(12deg) scaleY(.94)
      }

      50% {
        transform: translateY(-50%) rotate(-14deg) scaleY(1.06)
      }
    }

    /* CLAWS */
    .claw-layer {
      position: absolute;
      top: 32px;
      width: 42px;
      height: 165px;
      z-index: 25;
      pointer-events: none
    }

    .claw-layer.left {
      left: -20px
    }

    .claw-layer.right {
      right: -20px;
      transform: scaleX(-1)
    }

    .claw-shake {
      width: 100%;
      height: 100%;
      animation: clawShake 7.5s infinite
    }

    .finger {
      position: absolute;
      width: 100%;
      transform-origin: left center
    }

    .f1 {
      top: 10px;
      animation: f1 3s infinite
    }

    .f2 {
      top: 45px;
      animation: f2 4s -1.2s infinite
    }

    .f3 {
      top: 82px;
      animation: f3 3.5s -2s infinite
    }

    .f4 {
      top: 118px;
      animation: f4 5s -3s infinite
    }

    .f-base {
      position: absolute;
      left: 0;
      width: 21px;
      height: 11px;
      border-top: 1px solid rgba(100, 255, 100, .5);
      border-radius: 6px 0 0 6px;
      background: linear-gradient(#066c19, #000900);
      box-shadow: 2px 2px 5px #000
    }

    .f-mid {
      position: absolute;
      left: 18px;
      top: 1px;
      width: 14px;
      height: 9px;
      border-radius: 2px;
      background: linear-gradient(#08a522, #000a00);
      transform: rotate(-12deg);
      transform-origin: left
    }

    .f-tip {
      position: absolute;
      left: 10px;
      top: 1px;
      width: 23px;
      height: 8px;
      clip-path: polygon(0 10%, 100% 45%, 0 90%, 25% 45%);
      background: linear-gradient(90deg, #fff, #39ff14 36%, #004f00);
      filter: drop-shadow(0 0 3px var(--green));
      transform: rotate(-24deg);
      transform-origin: left
    }

    @keyframes clawShake {

      66%,
      78% {
        transform: translate(1.5px, -1px)
      }

      68%,
      80% {
        transform: translate(-1.5px, 1px)
      }
    }

    @keyframes f1 {

      0%,
      100% {
        transform: rotate(24deg)
      }

      25% {
        transform: rotate(29deg)
      }
    }

    @keyframes f2 {

      0%,
      100% {
        transform: rotate(9deg)
      }

      30% {
        transform: rotate(14deg)
      }
    }

    @keyframes f3 {

      0%,
      100% {
        transform: rotate(-6deg)
      }

      20% {
        transform: rotate(-2deg)
      }
    }

    @keyframes f4 {

      0%,
      100% {
        transform: rotate(-21deg)
      }

      35% {
        transform: rotate(-15deg)
      }
    }

    /* CARD */
    .box-wrapper {
      position: relative;
      z-index: 10;
      width: 218px;
      height: 276px;
      display: flex;
      overflow: hidden;
      padding: 2px;
      border-radius: 38px;
      background: #000;
      isolation: isolate;
      cursor: grab;
      box-shadow: 0 0 30px rgba(57, 255, 20, .38), 0 18px 50px rgba(0, 0, 0, .96);
      perspective: 800px
    }

    .box-wrapper:active {
      cursor: grabbing
    }

    .box-wrapper:before,
    .box-wrapper:after {
      content: "";
      position: absolute;
      left: -75%;
      top: -75%;
      width: 250%;
      height: 250%;
      z-index: 0;
      background: conic-gradient(from 0deg, transparent 64%, var(--green) 77%, #fff 82%, var(--cyan) 87%, transparent 100%);
      animation: plasma 3.8s linear infinite
    }

    .box-wrapper:after {
      background: conic-gradient(from 180deg, transparent 64%, var(--green2) 77%, var(--gold) 82%, var(--lime) 88%, transparent 100%);
      animation-duration: 5.2s;
      animation-direction: reverse;
      opacity: .72
    }

    @keyframes plasma {
      to {
        transform: rotate(360deg)
      }
    }

    .box {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 36px;
      padding: 10px 9px 9px;
      background: radial-gradient(circle at 50% -10%, rgba(0, 83, 30, .72), transparent 53%), linear-gradient(#001208, #000803 57%, #000201);
      box-shadow: inset 0 0 22px rgba(57, 255, 20, .24)
    }

    .box:after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(112deg, transparent 20%, rgba(255, 255, 255, .08) 35%, transparent 49%);
      transform: translateX(-130%);
      animation: panelShine 6.3s linear infinite
    }

    @keyframes panelShine {
      to {
        transform: translateX(160%)
      }
    }

    .ambient {
      position: absolute;
      inset: -40%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 30% 70%, rgba(0, 234, 255, .08), transparent 28%), radial-gradient(circle at 65% 35%, rgba(57, 255, 20, .15), transparent 30%);
      filter: blur(13px);
      animation: ambient 10s ease-in-out infinite alternate
    }

    @keyframes ambient {
      to {
        transform: rotate(24deg) scale(1.15)
      }
    }

    .dot-field {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none
    }

    .dot-field i {
      position: absolute;
      bottom: -8px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 5px var(--green);
      opacity: 0;
      animation: rise 5s linear infinite
    }

    .dot-field i:nth-child(1) {
      left: 12%;
      animation-delay: 0s
    }

    .dot-field i:nth-child(2) {
      left: 29%;
      animation-delay: 1.2s;
      animation-duration: 6s
    }

    .dot-field i:nth-child(3) {
      left: 49%;
      animation-delay: 2.4s
    }

    .dot-field i:nth-child(4) {
      left: 72%;
      animation-delay: .6s;
      animation-duration: 5.8s
    }

    .dot-field i:nth-child(5) {
      left: 87%;
      animation-delay: 3s;
      animation-duration: 4.7s
    }

    @keyframes rise {

      20%,
      78% {
        opacity: .8
      }

      to {
        transform: translateY(-285px) scale(1.25);
        opacity: 0
      }
    }

    /* RESTORED ORIGINAL CARD EFFECT LAYERS */
    .gloss-stream {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 3
    }

    .gloss-line {
      position: absolute;
      width: 1.5px;
      border-radius: 2px;
      opacity: 0;
      background: linear-gradient(180deg, transparent, rgba(0, 255, 65, .2) 20%, #fff 60%, rgba(0, 255, 65, .9) 80%, transparent);
      filter: drop-shadow(0 0 3px var(--green));
      animation: glossFall linear infinite
    }

    .gl-1 {
      left: 16%;
      height: 46px;
      animation-duration: 2.6s
    }

    .gl-2 {
      left: 38%;
      height: 32px;
      animation-duration: 3.2s;
      animation-delay: 1.1s
    }

    .gl-3 {
      left: 64%;
      height: 52px;
      animation-duration: 2.2s;
      animation-delay: .5s
    }

    .gl-4 {
      left: 84%;
      height: 38px;
      animation-duration: 3s;
      animation-delay: 1.7s
    }

    .gl-5 {
      left: 50%;
      height: 44px;
      animation-duration: 2.8s;
      animation-delay: 2.1s
    }

    @keyframes glossFall {
      0% {
        transform: translateY(-60px);
        opacity: 0
      }

      25%,
      75% {
        opacity: .9
      }

      100% {
        transform: translateY(290px);
        opacity: 0
      }
    }

    .panel-sweep {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
      border-radius: 36px
    }

    .panel-sweep:before {
      content: "";
      position: absolute;
      top: -30%;
      left: -60%;
      width: 60%;
      height: 160%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 65, .07) 45%, rgba(255, 255, 255, .12) 50%, rgba(0, 255, 65, .07) 55%, transparent);
      transform: skewX(-18deg);
      animation: panelSweepMove 6.5s linear infinite;
      filter: blur(1px)
    }

    @keyframes panelSweepMove {
      to {
        transform: translateX(320%) skewX(-18deg)
      }
    }

    .bg-anim {
      position: absolute;
      inset: 0;
      border-radius: 36px;
      overflow: hidden;
      pointer-events: none;
      z-index: 1
    }

    .aurora {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle at 50% 50%, rgba(0, 255, 65, .16), transparent 40%), radial-gradient(circle at 30% 70%, rgba(57, 255, 20, .10), transparent 40%), radial-gradient(circle at 70% 30%, rgba(127, 255, 0, .10), transparent 40%);
      filter: blur(14px);
      animation: auroraSwirl 10s ease-in-out infinite alternate;
      mix-blend-mode: screen
    }

    @keyframes auroraSwirl {
      0% {
        transform: scale(1) rotate(0)
      }

      50% {
        transform: scale(1.2) rotate(18deg)
      }

      100% {
        transform: scale(1.05) rotate(-10deg)
      }
    }

    .inner {
      position: relative;
      z-index: 5;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between
    }

    .hdr {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-bottom: 3px;
      border-bottom: 1px solid rgba(57, 255, 20, .34)
    }

    .title-bar {
      min-height: 25px;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 3px 7px;
      border: 1px solid rgba(57, 255, 20, .46);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(57, 255, 20, .17), rgba(0, 0, 0, .9), rgba(0, 234, 255, .12));
      box-shadow: 0 2px 5px #000
    }

    .brand-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: hidden
    }

    .card-title {
      display: inline-block;
      white-space: nowrap;
      color: #fff;
      font: 900 11px Audiowide;
      letter-spacing: .7px;
      text-align: center;
      text-shadow: 0 0 8px var(--green), 0 0 14px rgba(255, 255, 255, .35)
    }

    .stat-strip {
      display: flex;
      gap: 3px
    }

    .stat-pill {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 2px;
      white-space: nowrap;
      padding: 2px;
      border: 1px solid rgba(57, 255, 20, .38);
      border-radius: 6px;
      background: linear-gradient(rgba(57, 255, 20, .18), rgba(0, 20, 7, .75));
      font: 6.3px Share Tech Mono
    }

    .stat-pill .val {
      color: var(--gold);
      font-weight: 700;
      text-shadow: 0 0 4px var(--gold)
    }

    /* STAGE */
    .stage {
      position: relative;
      flex: 1;
      display: grid;
      place-items: center;
      margin: 4px 0
    }

    .eye-housing {
      position: relative;
      width: 186px;
      height: 122px;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      border: 1.2px solid rgba(57, 255, 20, .58);
      border-radius: 19px;
      background: radial-gradient(circle, rgba(0, 234, 255, .08), transparent 58%), linear-gradient(145deg, rgba(0, 27, 10, .98), rgba(0, 5, 2, .99));
      box-shadow: 0 0 19px rgba(57, 255, 20, .35), inset 0 0 24px rgba(57, 255, 20, .2);
      perspective: 520px
    }

    .stage-grid {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .55;
      background-image: linear-gradient(rgba(57, 255, 20, .1) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 20, .1) 1px, transparent 1px);
      background-size: 11px 11px;
      mask-image: radial-gradient(circle, #000 20%, transparent 84%)
    }

    .corner {
      position: absolute;
      z-index: 40;
      width: 8px;
      height: 8px;
      border-color: var(--green);
      border-style: solid;
      filter: drop-shadow(0 0 3px var(--green));
      pointer-events: none
    }

    .tl {
      top: 4px;
      left: 4px;
      border-width: 1.5px 0 0 1.5px
    }

    .tr {
      top: 4px;
      right: 4px;
      border-width: 1.5px 1.5px 0 0
    }

    .bl {
      bottom: 4px;
      left: 4px;
      border-width: 0 0 1.5px 1.5px
    }

    .br {
      right: 4px;
      bottom: 4px;
      border-width: 0 1.5px 1.5px 0
    }

    /* IDLE EYE */
    .eye-ring {
      position: relative;
      z-index: 5;
      width: 87px;
      height: 55px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(57, 255, 20, .45);
      border-radius: 13px;
      background: radial-gradient(circle, rgba(0, 66, 23, .9), rgba(0, 0, 0, .45));
      box-shadow: inset 0 0 14px rgba(57, 255, 20, .3), 0 0 12px rgba(57, 255, 20, .25);
      animation: eyeRing 7s linear infinite;
      transition: opacity .25s
    }

    .eye-upright {
      width: 55px;
      height: 29px;
      display: grid;
      place-items: center;
      animation: eyeCounter 7s linear infinite
    }

    .eye-blink {
      width: 100%;
      height: 100%;
      animation: organicBlink 7s cubic-bezier(.8, 0, .2, 1) infinite
    }

    .dragon-eye {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      clip-path: path('M 0 14 Q 27 -5 54 14 Q 27 33 0 14');
      background: radial-gradient(ellipse, #006d19, #001a08 78%, #000)
    }

    .iris {
      position: relative;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: radial-gradient(circle, #fff900 5%, #00ff66 30%, #00a92c 62%, #002a0c);
      box-shadow: 0 0 15px rgba(57, 255, 20, .9);
      animation: eyeScan 10s ease-in-out infinite
    }

    .pupil {
      width: 3px;
      height: 17px;
      border-radius: 50%;
      background: #000;
      box-shadow: 0 0 6px var(--green)
    }

    .glare {
      position: absolute;
      left: 6px;
      top: 3px;
      width: 3px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      filter: blur(.3px)
    }

    @keyframes eyeRing {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes eyeCounter {
      to {
        transform: rotate(-360deg)
      }
    }

    @keyframes organicBlink {

      0%,
      90%,
      96%,
      100% {
        transform: scaleY(1)
      }

      92%,
      98% {
        transform: scaleY(.04)
      }
    }

    @keyframes eyeScan {

      25%,
      35% {
        transform: translate(-4px, -2px)
      }

      45%,
      55% {
        transform: translate(4px, 2px)
      }

      65% {
        transform: scale(1.1)
      }
    }

    /* STATUS */
    #statusOverlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center
    }

    #statusOverlay.show {
      display: flex
    }

    .status-main {
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #fff, 0 0 14px var(--green)
    }

    .status-sub {
      margin-top: 3px;
      color: var(--cyan);
      font: 700 8px Share Tech Mono;
      text-shadow: 0 0 6px var(--cyan)
    }

    .status-hint {
      margin-top: 3px;
      color: var(--gold);
      font: 700 7px Share Tech Mono;
      text-shadow: 0 0 4px var(--gold)
    }

    /* ================================================================
   3D QUANTUM CONVERGENCE SCANNER
   ================================================================ */
    #stageScanner {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      overflow: hidden;
      transform-style: preserve-3d;
      background: radial-gradient(circle at 50% 52%, rgba(0, 234, 255, .11), transparent 37%), radial-gradient(circle at 50% 52%, rgba(57, 255, 20, .09), transparent 65%)
    }

    #stageScanner.active {
      display: block
    }

    #housingScanCanvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .scan-vignette {
      position: absolute;
      inset: 0;
      z-index: 18;
      pointer-events: none;
      box-shadow: inset 0 0 20px #000, inset 0 0 8px rgba(57, 255, 20, .35)
    }

    .scan-depth-grid {
      position: absolute;
      left: -20%;
      right: -20%;
      bottom: -62%;
      height: 130%;
      z-index: 1;
      transform: rotateX(67deg);
      transform-origin: 50% 0;
      background-image: linear-gradient(rgba(0, 234, 255, .22) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 20, .18) 1px, transparent 1px);
      background-size: 12px 12px;
      animation: gridDrive .8s linear infinite;
      mask-image: linear-gradient(transparent, #000 35%, transparent 88%)
    }

    @keyframes gridDrive {
      to {
        background-position: 0 12px
      }
    }

    .scan-topline {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 7px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font: 700 6.5px Share Tech Mono;
      letter-spacing: .1em
    }

    .scan-chip {
      padding: 2px 5px;
      border: 1px solid rgba(0, 234, 255, .5);
      border-radius: 4px;
      color: var(--cyan);
      background: rgba(0, 15, 18, .75);
      box-shadow: 0 0 7px rgba(0, 234, 255, .2)
    }

    .scan-chip.live {
      color: var(--green);
      border-color: rgba(57, 255, 20, .55)
    }

    .scan-chip.live:before {
      content: "●";
      margin-right: 3px;
      animation: blink .7s infinite
    }

    .scan-reactor {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      filter: drop-shadow(0 0 7px rgba(0, 234, 255, .48))
    }

    .scan-orbit {
      position: absolute;
      inset: 4px;
      border: 1px solid var(--cyan);
      border-radius: 50%;
      transform-style: preserve-3d;
      box-shadow: 0 0 8px rgba(0, 234, 255, .35), inset 0 0 7px rgba(0, 234, 255, .2)
    }

    .scan-orbit:before,
    .scan-orbit:after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 7px currentColor
    }

    .scan-orbit:before {
      left: 7px;
      top: 5px
    }

    .scan-orbit:after {
      right: 4px;
      bottom: 12px
    }

    .orbit-a {
      color: var(--cyan);
      transform: rotateX(66deg) rotateZ(0);
      animation: orbitA 1.2s linear infinite
    }

    .orbit-b {
      inset: 10px;
      color: var(--green);
      border-color: var(--green);
      transform: rotateY(68deg) rotateZ(25deg);
      animation: orbitB 1.5s linear infinite reverse
    }

    .orbit-c {
      inset: 16px;
      color: var(--gold);
      border-color: var(--gold);
      transform: rotateX(58deg) rotateY(56deg);
      animation: orbitC 1s linear infinite
    }

    @keyframes orbitA {
      to {
        transform: rotateX(66deg) rotateZ(360deg)
      }
    }

    @keyframes orbitB {
      to {
        transform: rotateY(68deg) rotateZ(385deg)
      }
    }

    @keyframes orbitC {
      to {
        transform: rotateX(58deg) rotateY(56deg) rotateZ(360deg)
      }
    }

    .core-cube {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%) rotateX(-22deg) rotateY(35deg);
      animation: cubeTurn 2.2s linear infinite
    }

    .cube-face {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .8);
      background: linear-gradient(135deg, rgba(0, 234, 255, .75), rgba(57, 255, 20, .18));
      box-shadow: inset 0 0 7px rgba(255, 255, 255, .5), 0 0 8px var(--cyan);
      backface-visibility: visible
    }

    .cube-face.f {
      transform: translateZ(9px)
    }

    .cube-face.b {
      transform: rotateY(180deg) translateZ(9px)
    }

    .cube-face.r {
      transform: rotateY(90deg) translateZ(9px)
    }

    .cube-face.l {
      transform: rotateY(-90deg) translateZ(9px)
    }

    .cube-face.t {
      transform: rotateX(90deg) translateZ(9px)
    }

    .cube-face.bt {
      transform: rotateX(-90deg) translateZ(9px)
    }

    @keyframes cubeTurn {
      to {
        transform: translate(-50%, -50%) rotateX(338deg) rotateY(395deg)
      }
    }

    .scan-halo {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 6;
      width: 82px;
      height: 82px;
      border: 1px dashed rgba(57, 255, 20, .55);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(var(--halo-scale, .72));
      animation: spin 5s linear infinite;
      box-shadow: 0 0 12px rgba(57, 255, 20, .15)
    }

    .scan-beam {
      position: absolute;
      left: -20%;
      top: 50%;
      z-index: 10;
      width: 140%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan) 25%, #fff 50%, var(--green) 75%, transparent);
      box-shadow: 0 0 8px var(--cyan), 0 0 14px var(--green);
      animation: beamScan 1.25s ease-in-out infinite;
      opacity: .8
    }

    .scan-beam:after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -10px;
      height: 21px;
      background: linear-gradient(transparent, rgba(0, 234, 255, .08), transparent)
    }

    @keyframes beamScan {

      0%,
      100% {
        transform: translateY(-37px);
        opacity: .15
      }

      50% {
        transform: translateY(37px);
        opacity: .95
      }
    }

    .scan-percent {
      position: absolute;
      right: 9px;
      top: 28px;
      z-index: 20;
      color: #fff;
      font: 700 20px/1 Teko;
      text-shadow: 0 0 8px #fff, 0 0 14px var(--cyan)
    }

    .scan-percent small {
      display: block;
      color: var(--green);
      font: 700 5px Share Tech Mono;
      letter-spacing: .14em;
      text-align: right
    }

    .scan-bottom {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 7px;
      z-index: 20
    }

    .scan-log {
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #dfffff;
      font: 700 6.5px Share Tech Mono;
      letter-spacing: .03em
    }

    .scan-log span {
      color: var(--gold);
      text-shadow: 0 0 5px var(--gold)
    }

    .scan-track {
      height: 3px;
      margin-top: 3px;
      overflow: hidden;
      border-radius: 3px;
      background: rgba(255, 255, 255, .12);
      box-shadow: inset 0 0 3px #000
    }

    .scan-track-fill {
      width: calc(var(--scan-progress)*100%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--cyan), var(--gold));
      box-shadow: 0 0 8px var(--cyan);
      transition: width .06s linear
    }

    .scan-glitch {
      position: absolute;
      inset: 0;
      z-index: 17;
      pointer-events: none;
      opacity: .12;
      background: repeating-linear-gradient(transparent 0 3px, rgba(255, 255, 255, .15) 4px);
      mix-blend-mode: screen;
      animation: scanNoise .13s steps(2) infinite
    }

    @keyframes scanNoise {
      50% {
        transform: translateX(1px)
      }
    }

    .scan-complete-flash {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: #fff;
      opacity: 0
    }

    .scan-complete-flash.fire {
      animation: completeFlash .4s ease-out
    }

    @keyframes completeFlash {
      0% {
        opacity: 0
      }

      25% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    /* ================================================================
   NEW 3D IMAGE-BASED PREDICTION REVEAL
   ================================================================ */
    #predDisplay {
      position: absolute;
      inset: 0;
      z-index: 31;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 5px;
      perspective: 650px
    }

    #predDisplay.active {
      display: flex
    }

    .pred-shell {
      position: relative;
      width: 174px;
      height: 110px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 7px 20px;
      border: 1px solid rgba(0, 234, 255, .45);
      clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
      background: radial-gradient(circle at 30% 50%, rgba(57, 255, 20, .15), transparent 38%), linear-gradient(145deg, rgba(0, 26, 17, .94), rgba(0, 4, 4, .98));
      box-shadow: inset 0 0 17px rgba(0, 234, 255, .17), 0 0 15px rgba(0, 234, 255, .18);
      transform-style: preserve-3d
    }

    #predDisplay.reveal .pred-shell {
      animation: predReveal .62s cubic-bezier(.17, .9, .24, 1.22)
    }

    @keyframes predReveal {
      0% {
        opacity: 0;
        transform: rotateX(70deg) rotateZ(-7deg) scale(.55) translateZ(-100px);
        filter: blur(5px)
      }

      70% {
        opacity: 1;
        transform: rotateX(-7deg) rotateZ(1deg) scale(1.04)
      }

      100% {
        transform: none;
        filter: none
      }
    }

    .pred-shell:before {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(57, 255, 20, .2);
      clip-path: inherit;
      pointer-events: none
    }

    .pred-shell:after {
      content: "";
      position: absolute;
      left: -45%;
      top: -20%;
      width: 40%;
      height: 140%;
      z-index: 20;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .28), transparent);
      transform: skewX(-18deg);
      pointer-events: none;
      animation: predSweep 2.8s ease-in-out infinite
    }

    @keyframes predSweep {

      60%,
      100% {
        left: 125%
      }
    }

    .pred-number-pod {
      position: relative;
      z-index: 4;
      width: 76px;
      height: 76px;
      flex: none;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      transform: rotateY(-7deg)
    }

    .pod-plate {
      position: absolute;
      inset: 6px;
      clip-path: polygon(22% 0, 78% 0, 100% 22%, 100% 78%, 78% 100%, 22% 100%, 0 78%, 0 22%);
      background: linear-gradient(145deg, rgba(0, 234, 255, .28), rgba(0, 7, 5, .96) 48%, rgba(57, 255, 20, .18));
      border: 1px solid var(--cyan);
      box-shadow: 0 0 13px rgba(0, 234, 255, .55), inset 0 0 15px rgba(57, 255, 20, .25);
      transform: translateZ(7px)
    }

    .pod-plate:before {
      content: "";
      position: absolute;
      inset: 4px;
      clip-path: inherit;
      border: 1px dashed rgba(255, 230, 0, .48);
      animation: podPulse 1.6s ease-in-out infinite
    }

    .pod-plate:after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(transparent 0 5px, rgba(0, 234, 255, .1) 6px);
      mix-blend-mode: screen
    }

    @keyframes podPulse {
      50% {
        opacity: .4;
        transform: scale(.92)
      }
    }

    .pod-ring {
      position: absolute;
      inset: 0;
      border: 1px solid var(--green);
      border-radius: 50%;
      transform-style: preserve-3d;
      box-shadow: 0 0 9px rgba(57, 255, 20, .32)
    }

    .pod-ring.r1 {
      transform: rotateX(67deg);
      animation: podRing1 2.2s linear infinite
    }

    .pod-ring.r2 {
      inset: 4px;
      border-color: var(--cyan);
      transform: rotateY(68deg);
      animation: podRing2 2.7s linear infinite reverse
    }

    .pod-ring:before {
      content: "";
      position: absolute;
      left: 9px;
      top: 3px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 7px currentColor
    }

    @keyframes podRing1 {
      to {
        transform: rotateX(67deg) rotateZ(360deg)
      }
    }

    @keyframes podRing2 {
      to {
        transform: rotateY(68deg) rotateZ(360deg)
      }
    }

    .number-img-wrap {
      position: relative;
      z-index: 7;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      transform: translateZ(14px)
    }

    #predNumberImg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 9px var(--green)) drop-shadow(0 5px 8px #000)
    }

    #predDisplay.reveal #predNumberImg {
      animation: imageReveal .7s cubic-bezier(.15, .9, .2, 1.25), digitHover 2.2s .7s ease-in-out infinite
    }

    @keyframes imageReveal {
      0% {
        opacity: 0;
        transform: translateZ(-80px) rotateY(180deg) scale(.1);
        filter: blur(7px)
      }

      65% {
        opacity: 1;
        transform: translateZ(20px) rotateY(-12deg) scale(1.18)
      }

      100% {
        transform: none
      }
    }

    @keyframes digitHover {
      50% {
        transform: translateY(-3px) scale(1.035)
      }
    }

    #predNumberFallback {
      display: none;
      color: #fff;
      font: 700 48px/1 Teko;
      text-shadow: 0 0 7px #fff, 0 0 15px var(--green)
    }

    .pred-info {
      position: relative;
      z-index: 4;
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transform: translateZ(5px)
    }

    .pred-lock-label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--cyan);
      font: 700 6px Share Tech Mono;
      letter-spacing: .08em
    }

    .pred-lock-label:before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 1px;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink .75s infinite
    }

    .pred-badge {
      padding: 7px 5px;
      border-radius: 7px;
      text-align: center;
      color: #fff;
      font: 14px Bungee;
      letter-spacing: .08em;
      text-shadow: 0 1px 3px #000;
      transform: skewX(-4deg);
      overflow: hidden
    }

    .pred-badge.big {
      border: 1px solid #baffc7;
      background: linear-gradient(145deg, #38ff7a, #009833 66%, #003612);
      box-shadow: 0 0 14px rgba(57, 255, 100, .67), inset 0 2px 4px rgba(255, 255, 255, .55)
    }

    .pred-badge.small {
      border: 1px solid #bdf7ff;
      background: linear-gradient(145deg, #2ceaff, #007db4 66%, #002b46);
      box-shadow: 0 0 14px rgba(0, 234, 255, .67), inset 0 2px 4px rgba(255, 255, 255, .55)
    }

    .pred-sync {
      display: flex;
      align-items: center;
      gap: 3px;
      color: #d9fff2;
      font: 6px Share Tech Mono
    }

    .pred-sync-track {
      flex: 1;
      height: 3px;
      overflow: hidden;
      border-radius: 3px;
      background: rgba(255, 255, 255, .15)
    }

    .pred-sync-fill {
      width: 99%;
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--cyan), var(--gold));
      box-shadow: 0 0 5px var(--cyan)
    }

    .pred-sync b {
      color: var(--gold)
    }

    .pred-meta {
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, .72);
      font: 5.5px Share Tech Mono;
      letter-spacing: .04em
    }

    .pred-meta strong {
      color: var(--green)
    }

    .pred-period {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 5px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 15px;
      border-top: 1px solid rgba(0, 234, 255, .45);
      background: linear-gradient(90deg, transparent, rgba(0, 234, 255, .15), transparent);
      color: #fff;
      font: 800 7px Share Tech Mono;
      letter-spacing: .15em;
      text-shadow: 0 0 7px var(--cyan)
    }

    .pred-corners {
      position: absolute;
      inset: 0;
      z-index: 21;
      pointer-events: none
    }

    .pred-corners i {
      position: absolute;
      width: 9px;
      height: 9px;
      border: 2px solid var(--gold)
    }

    .pred-corners i:nth-child(1) {
      left: 2px;
      top: 2px;
      border-right: 0;
      border-bottom: 0
    }

    .pred-corners i:nth-child(2) {
      right: 2px;
      top: 2px;
      border-left: 0;
      border-bottom: 0
    }

    .pred-corners i:nth-child(3) {
      left: 2px;
      bottom: 2px;
      border-right: 0;
      border-top: 0
    }

    .pred-corners i:nth-child(4) {
      right: 2px;
      bottom: 2px;
      border-left: 0;
      border-top: 0
    }

    /* BUTTONS */
    .btns {
      display: flex;
      gap: 6px;
      z-index: 10
    }

    .btns button {
      position: relative;
      flex: 1;
      height: 31px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      text-transform: uppercase;
      font: 800 8px Orbitron;
      letter-spacing: 1px;
      transition: .15s;
      pointer-events: auto
    }

    .btn-action {
      color: #001006;
      background: linear-gradient(rgba(255, 255, 255, .8), transparent 42%), linear-gradient(90deg, var(--lime), var(--gold), var(--green), var(--lime));
      background-size: 100%, 300% 100%;
      box-shadow: 0 2px 0 #00651d, 0 4px 8px #000, 0 0 14px rgba(57, 255, 20, .55);
      animation: buttonFlow 3s linear infinite
    }

    .btn-hide {
      color: #fff;
      border: 1px solid var(--green2) !important;
      background: linear-gradient(rgba(255, 255, 255, .13), transparent 43%), linear-gradient(90deg, #001907, #00501d, #001907);
      box-shadow: 0 2px 0 #00250c, 0 4px 8px #000, inset 0 0 8px rgba(57, 255, 20, .3)
    }

    .btns button:active {
      transform: translateY(2px) scale(.98)
    }

    .btns button:disabled {
      opacity: .58;
      cursor: not-allowed;
      animation: none
    }

    @keyframes buttonFlow {
      to {
        background-position: 0, 300% 0
      }
    }

    @media(max-width:360px) {
      .box-wrapper {
        width: 210px;
        height: 269px
      }

      .eye-housing {
        width: 180px;
        height: 118px
      }

      .pred-shell {
        width: 169px;
        height: 106px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *:before,
      *:after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important
      }
    }
  </style>
